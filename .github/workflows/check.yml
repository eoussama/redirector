name: Check

# Runs the same `pnpm check` that Workers Builds runs before a deploy, so a pull request
# shows whether it would deploy before it is merged.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@v6

      - name: Set up Node (the version in .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check (audit, lint, types, links, tests, build)
        run: pnpm check
